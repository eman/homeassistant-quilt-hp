rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom service actions are registered; only entity services.
  appropriate-polling:
    status: done
    comment: Push-first (gRPC stream); polling is a 5-minute fallback.
  brands:
    status: exempt
    comment: Custom integration distributed via HACS; not in the brands repo.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: CoordinatorEntity manages its listener lifecycle.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: Auth failures raise ConfigEntryAuthFailed; transient failures ConfigEntryNotReady.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: Coordinator write helper raises HomeAssistantError; unknown presets raise ServiceValidationError.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service with no local network presence to discover.
  discovery-update-info:
    status: exempt
    comment: See discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: stream_degraded repair issue with polling-interval placeholder; auto-resolves.
  stale-devices:
    status: done
    comment: Stale devices are removed from the registry at setup.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: quilt-hp-python uses gRPC (grpc.aio), not aiohttp/httpx.
  strict-typing: done
